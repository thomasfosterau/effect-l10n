# pnpm workspace for the `effect-l10n` packages (`packages/*`).
#
# EVERY external dependency version lives here: package.json files reference
# only `catalog:` (or `workspace:` for a sibling). `catalogMode: strict` makes
# `pnpm add` write `catalog:` and reject a version outside the catalog. After
# editing this catalog, ALWAYS run `pnpm install` and commit the regenerated
# pnpm-lock.yaml: a stale lockfile fails CI at once with
# ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
#
# The toolchain (vite-plus, the Effect lint preset, the TypeScript 6/7 pair,
# @effect/tsgo, fallow) is kept in step with the sibling Effect libraries
# (effect-web is the family's reference workspace). Dependabot's groups in
# .github/dependabot.yml cover only the lockstep sets named below (the
# toolchain group and the Effect line).
packages:
  - packages/*

catalogMode: strict

catalog:
  # Lints each package's packed tarball for type-resolution problems (the
  # `check:package` task, with publint).
  "@arethetypeswrong/cli": ^0.18.5
  "@changesets/cli": ^3.0.3
  # The Effect language service as a TypeScript (JS API) plugin: editor
  # diagnostics, quick fixes and refactors. Loaded through the `plugins` entry
  # in tsconfig.base.json by the TS6 `typescript` below (editors run the JS
  # tsserver); the CLI gate gets the same rules natively from @effect/tsgo.
  "@effect/language-service": ^0.87.5
  # The Effect language service as a native (TypeScript-Go) binary, the TS7
  # side of the 6/7 split. `effect-tsgo patch --typescript --oxlint` (the root
  # `prepare`) overwrites the native `tsc` and oxlint-tsgolint binaries with
  # Effect-patched builds matched by gitHead, so this pins in lockstep with
  # `@typescript/native` below and with the oxlint / oxlint-tsgolint that
  # `vite-plus` carries: 0.67.3 patches typescript 7.0.2 and the oxlint
  # 1.91.0 / tsgolint 7.0.2005 that vite-plus 1.5.0 carries. Each release
  # hard-errors
  # (UnsupportedTargetPackageVersionError) on any other component version,
  # failing `pnpm install` itself: read the `components` table in
  # node_modules/@effect/tsgo/dist/effect-tsgo.cjs before bumping any of the
  # three (toolchain group).
  "@effect/tsgo": 0.67.3
  # The Node `FileSystem` / `Path` layers the golden-file helper
  # (`@thomasfosterau/effect-l10n-testing`) runs on. The shared package rather than
  # @effect/platform-node, whose required `redis` peer pnpm would install.
  # Lockstep with `effect`.
  "@effect/platform-node-shared": 4.1.2
  # Lockstep with `effect` (the Effect 4 line is released as one version).
  "@effect/vitest": 4.1.2
  # The Effect lint preset (`effect/*` rules, anti-slop included), loaded by
  # the oxlint vite-plus carries. Not in the toolchain group: it takes
  # `@oxlint/plugins` through a `^` range, so Dependabot proposes it alone.
  "@enfect/oxlint": ^0.10.0
  # Must equal the vitest that vite-plus bundles (see `vitest` below); vite-plus
  # refuses to run coverage on a mismatch (toolchain group).
  "@vitest/coverage-istanbul": 5.1.0
  # Exact: the singleton every package builds and tests against (see the
  # `effect` override). The range published packages declare is under
  # `catalogs.peers`.
  effect: 4.1.2
  fallow: 3.40.0
  # Lints each package's manifest and `exports` against what it publishes
  # (the `check:package` task).
  publint: ^0.3.25
  # TypeScript 6/7 side by side: TS7 (the native Go compiler) ships no JS API
  # until 7.1, so JS-API consumers (@effect/language-service in the editor,
  # tsdown's declaration bundler in `vp pack`) stay on TS6 while the native
  # TS7 `tsc` type-checks. The alias keeps the TS6 JS compiler importable as
  # `typescript` (its bins are `tsc6` / `tsserver6`); `@typescript/native` is
  # TS7 and owns the `tsc` bin the `check` tasks run. Both exact:
  # @typescript/native's gitHead must match @effect/tsgo's bundled binary.
  typescript: "npm:@typescript/typescript6@6.0.2"
  "@typescript/native": "npm:typescript@7.0.2"
  # vite-plus pins `oxlint`, `oxfmt`, `oxlint-tsgolint` and `vitest` to exact
  # versions: 1.5.0 carries oxlint 1.91.0, oxfmt 0.76.0, oxlint-tsgolint
  # 7.0.2005 and vitest 5.1.0. `vite` is the same release under its aliased
  # core package (an npm alias Dependabot cannot bump: set it by hand, or run
  # `pnpm exec vp migrate`, in the toolchain PR). `vitest` must match
  # vite-plus's exact pin because the `vitest@*: "catalog:"` override forces
  # every resolution to this singleton.
  vite-plus: 1.5.0
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vitest: 5.1.0

# Peer ranges the PUBLISHED packages declare, kept as a named catalog so the
# strict catalog mode still governs them while they stay ranges. `pnpm
# publish` replaces `catalog:peers` with these ranges in the published
# manifest. Raising a floor is a breaking change for every published package.
catalogs:
  peers:
    effect: ^4.1.0

overrides:
  # `effect` MUST be a singleton: two copies break Context / Layer / Schema
  # identity at runtime. Force every resolution to the catalog version,
  # including the exact one @enfect/oxlint declares (its rules lint fine
  # against the singleton).
  effect: "catalog:"
  # Vite+'s managed pins (`vp migrate`): the `@*` range rewrites the semver
  # specs transitive and peer declarations use, leaving `catalog:` intact.
  vite@*: "catalog:"
  vitest@*: "catalog:"

allowBuilds:
  esbuild: true
  fallow: true

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

# Supply-chain delay (the owner's policy across the family): hold newly
# published versions for 480 MINUTES (8 hours) before pnpm will install them.
# Dependabot's `cooldown` (whole days only) is 1 day, longer than this, so it
# never proposes a version pnpm would still refuse.
minimumReleaseAge: 480
minimumReleaseAgeExclude:
  # @thomasfosterau/* is first-party: exempt so our own releases install immediately.
  - "@thomasfosterau/*"
