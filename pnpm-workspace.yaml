# Every external version lives here; package.json files reference only
# `catalog:` (or `workspace:` for a sibling). After editing, run `vp install`
# and commit pnpm-lock.yaml.
packages:
  - packages/*

catalogMode: strict

catalog:
  "@arethetypeswrong/cli": ^0.18.5
  "@changesets/cli": ^3.0.3
  # The editor plugin (TS6 tsserver); the CLI gate gets the same rules from
  # @effect/tsgo.
  "@effect/language-service": ^0.87.5
  # `effect-tsgo patch` (the root `prepare`) supports only the `@typescript/native`
  # and the oxlint / tsrs versions vite-plus bundles (its README's supported
  # versions table) and fails `vp install` on any other: bump it with them.
  # From vite-plus 1.7, type-aware lint runs on tsrs, not oxlint-tsgolint.
  "@effect/tsgo": 0.73.2
  # Node layers for the testing package, without @effect/platform-node's
  # `redis` peer.
  "@effect/platform-node-shared": 4.1.4
  "@effect/vitest": 4.1.4
  "@enfect/oxlint": ^0.10.0
  # Must equal the vitest vite-plus pins.
  "@vitest/coverage-istanbul": 5.1.0
  # The singleton the workspace builds against; published ranges are in
  # `catalogs.peers`.
  effect: 4.1.4
  fallow: 3.46.0
  publint: ^0.3.25
  # TS6 (JS API, for the editor and `vp pack`'s declaration bundler) beside TS7
  # (the native `tsc` the `check` tasks run). Exact: @typescript/native must
  # match @effect/tsgo's patch.
  typescript: "npm:@typescript/typescript6@6.0.2"
  "@typescript/native": "npm:typescript@7.0.2"
  # `vite` and `vitest` must equal what this vite-plus pins; `vp migrate`
  # re-pins them.
  vite-plus: 1.7.0
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vitest: 5.1.0

# Peer ranges published packages declare. Raising a floor is a breaking change;
# raise it only when a dependency requires it, naming that dependency.
catalogs:
  peers:
    effect: ^4.0.0
  # The private testing package: @effect/platform-node-shared 4.1.2 requires
  # `effect: ^4.1.2`.
  platform-node-peers:
    effect: ^4.1.2

overrides:
  # `effect` must be a singleton: two copies break Context / Layer / Schema
  # identity.
  effect: "catalog:"
  vite@*: "catalog:"
  vitest@*: "catalog:"

allowBuilds:
  esbuild: true
  fallow: true

# Agent skills dependencies ship (pnpm 12.11+). `fallow` ships `fallow` and
# `fallow-setup`; only `fallow` is linked, since the repository is already set
# up. Build grants stay in `allowBuilds`: a `permissions` entry without `build`
# leaves its package's `allowBuilds` grant in force.
permissions:
  fallow:
    skills: [fallow]

skills:
  dirs: [.claude/skills]

peerDependencyRules:
  allowAny:
    - vitest
  allowedVersions:
    vitest: "*"

# Hold new releases for 24 hours; Dependabot's cooldown matches it.
minimumReleaseAge: 1440
