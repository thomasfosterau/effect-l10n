name: Release

# Changesets release flow: on every push to `trunk`, changesets/action either
# opens/updates the "Version Packages" PR (when unreleased changesets exist)
# or, once that PR has merged and no changesets remain, publishes the
# packages to npm through trusted publishing (OIDC) and tags the release.
# PUBLISHING.md has the flow and the owner's one-time setup.

on:
  push:
    branches: [trunk]

concurrency:
  group: release-${{ github.ref }}

# No permissions by default; the release job opts into exactly what it needs.
permissions: {}

jobs:
  release:
    name: Version or publish
    # Never on forks (they have neither the environment nor the trusted
    # publisher binding), and never for Dependabot: this job holds
    # `id-token: write` and the release environment.
    if: github.repository == 'thomasfosterau/effect-l10n' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A protected GitHub Environment (manual approval, `trunk` only) and the
    # environment npm's trusted publisher is bound to. See PUBLISHING.md for
    # the one-time setup.
    environment: release
    permissions:
      contents: write # push the version commit/tag and the "Version Packages" PR branch
      pull-requests: write # open/update the "Version Packages" PR
      id-token: write # OIDC: prove this workflow's identity to npm (trusted publishing; no token)
    env:
      # pnpm defaults `verify-deps-before-run` to `install`: before a `pnpm run`
      # / `pnpm exec` whose manifests look newer than the last install, it
      # re-installs WITH lifecycle scripts, ignoring the `--ignore-scripts` of
      # the install step below, inside this privileged job. Scoped to this job.
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - name: Checkout
        # The Changesets action pushes the version branch, so it needs the
        # checkout's git credentials (the ephemeral, job-scoped GITHUB_TOKEN).
        # zizmor: ignore[artipacked] -- the Changesets action pushes with these credentials.
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # Installs the pnpm version pinned by the package.json "packageManager"
      # field. Must run before setup-node so its pnpm cache can find the store.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          # A pinned major, never `latest`: setup-node resolves `latest` to the
          # first nodejs.org index entry, pre-releases included, which would
          # publish from an alpha Node (effect-svelte#214).
          node-version: 24.x
          check-latest: true
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # --ignore-scripts stops a compromised dependency from running install
      # scripts in the privileged publish job. It also skips the root
      # `prepare` (the Vite+ git hooks and the @effect/tsgo patch), neither of
      # which the `vp pack` build needs.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # While changesets are pending this opens/updates the "Version
      # Packages" PR (`pnpm run version-packages`). Once it has merged, it
      # runs `pnpm run release`: build every package, then
      # `pnpm -r publish --ignore-scripts`, which rewrites `catalog:` /
      # `workspace:` specifiers, skips private packages and versions npm
      # already has, and publishes through npm trusted publishing: pnpm
      # exchanges this job's OIDC token for a short-lived npm token, so there
      # is no NPM_TOKEN to steal. Provenance is attached automatically (the
      # repository and the packages are public). `changeset tag` then prints
      # the `New tag:` lines the action pushes as tags and GitHub releases.
      #
      # Every package is `private` until it ships its first API (AGENTS.md),
      # so until then this step publishes nothing.
      #
      # v2 of the action pairs with Changesets CLI v3 and renamed v1's
      # `version` / `publish` / `commit` / `title` inputs.
      - name: Create release PR or publish to npm
        uses: changesets/action@v2.1.2
        with:
          version-script: pnpm run version-packages
          publish-script: pnpm run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
