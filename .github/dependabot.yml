# Dependabot version updates.
#
# The `npm` ecosystem at `/` reads the pnpm workspace, its catalog and
# pnpm-lock.yaml, so a bump lands in pnpm-workspace.yaml's catalog (the only
# place a version lives) together with the regenerated lockfile.
#
# Groups exist only for dependencies which MUST move together (one release
# train with exact cross-pins, or a hard compatibility table), so they arrive
# in ONE PR (a PR moving one of them alone goes red). Everything else, majors
# and minors alike, is its own PR. Dependabot puts a dependency in the FIRST
# group whose patterns match, and `exclude-patterns` keeps a package out of a
# group that would otherwise claim it.
#
# - `toolchain`: `vite` (the vite-plus core alias), `vitest` and `@vitest/*`
#   must equal what that vite-plus release pins (it also pins oxlint, oxfmt
#   and oxlint-tsgolint). `@effect/tsgo` patches the native `tsc`
#   (`@typescript/native`) and oxlint-tsgolint, and hard-errors at install on
#   any version it does not support, so it moves with both: when a toolchain
#   PR goes red at install, move the `@effect/tsgo` pin by hand on its branch
#   (read the catalog comment first). The Effect lint preset
#   (`@enfect/oxlint`) takes `@oxlint/plugins` through a `^` range, so it is
#   not tied to the set and comes on its own.
# - `effect`: the Effect 4 line is lockstep-versioned (`effect`,
#   `@effect/vitest`, `@effect/platform-node-shared`). `@effect/tsgo` is the
#   toolchain's and `@effect/language-service` has its own release line, so
#   neither is in it.
#
# By hand, because Dependabot cannot bump them: the `vite` catalog entry is an
# npm alias (`npm:@voidzero-dev/vite-plus-core@<v>`) that must equal
# `vite-plus`, so set it in the toolchain PR that moves `vite-plus` (or run
# `pnpm exec vp migrate`, which re-pins it and `vitest`, then drop any
# `minimumReleaseAgeExclude` entries it adds); `typescript`
# (`npm:@typescript/typescript6@<v>`) and `@typescript/native`
# (`npm:typescript@<v>`) are npm aliases too, set by hand (the native one in
# lockstep with `@effect/tsgo`); the `peers` catalog's ranges are raised by
# hand (a breaking change); and the `effect` / `vite@*` / `vitest@*` keys under
# pnpm-workspace.yaml's `overrides` point at `catalog:`, so they follow their
# catalog entries.
#
# `cooldown`: pnpm-workspace.yaml's `minimumReleaseAge` is 480 minutes (8
# hours), and Dependabot's cooldown takes whole days only, so it is 1 day:
# longer than pnpm's hold, so a Dependabot PR never proposes a version pnpm
# would still refuse. It mirrors `minimumReleaseAgeExclude` (`@thomasfosterau/*`,
# first-party). zizmor's dependabot-cooldown audit wants 7 days; the owner's
# policy is 1, so that finding is ignored inline.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1 # zizmor: ignore[dependabot-cooldown] -- owner policy (see header)
      exclude:
        - "@thomasfosterau/*"
    groups:
      # vite-plus pins oxlint and vitest exactly; @effect/tsgo's patch supports
      # only the oxlint / TypeScript pairs its components table lists.
      toolchain:
        applies-to: version-updates
        patterns:
          - "vite-plus"
          - "vite"
          - "@voidzero-dev/*"
          - "vitest"
          - "@vitest/*"
          - "@effect/tsgo"
          - "@typescript/native"
          - "typescript"
          - "@typescript/typescript6"
        update-types: ["major", "minor", "patch"]
      # One Effect release train, released as one version.
      effect:
        applies-to: version-updates
        patterns:
          - "effect"
          - "@effect/*"
        exclude-patterns:
          - "@effect/tsgo"
          - "@effect/language-service"
        update-types: ["major", "minor", "patch"]
  - package-ecosystem: "github-actions"
    # The workflows, plus the local composite action they call.
    directories:
      - "/"
      - "/.github/actions/setup"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1 # zizmor: ignore[dependabot-cooldown] -- owner policy (see header)
  # The Dev Container features in .devcontainer/devcontainer.json. No group:
  # each feature updates on its own PR. The image tag is a hand move (it
  # follows the catalog's `vite-plus` pin; see the comment beside it).
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1 # zizmor: ignore[dependabot-cooldown] -- owner policy (see header)
