# Groups cover only sets that must move together. By-hand steps for the
# toolchain group are in docs/CONTRIBUTING.md.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    assignees: [thomasfosterau]
    labels: [dependencies]
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
      exclude:
        - "@thomasfosterau/*"
    # vite-plus pins these exactly; they move only with it, by hand (see
    # docs/CONTRIBUTING.md).
    ignore:
      - dependency-name: "vite"
      - dependency-name: "@voidzero-dev/*"
      - dependency-name: "vitest"
      - dependency-name: "@vitest/*"
    groups:
      toolchain:
        applies-to: version-updates
        patterns:
          - "vite-plus"
          - "@effect/tsgo"
      effect:
        applies-to: version-updates
        patterns:
          - "effect"
          - "@effect/*"
        exclude-patterns:
          - "@effect/tsgo"
          - "@effect/language-service"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    assignees: [thomasfosterau]
    labels: [dependencies]
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    assignees: [thomasfosterau]
    labels: [dependencies]
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
